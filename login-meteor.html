<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>登录 - 流星雨</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    margin: 0;
    overflow: hidden;
    height: 100vh;
    background: #000;
    font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  canvas#meteorCanvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1;
    pointer-events: none;
  }

  .card-wrapper {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
  }

  .card {
    width: 380px;
    max-width: 90vw;
    padding: 48px 40px;
    border-radius: 20px;
    background: rgba(20, 30, 40, 0.65);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
  }

  .card-title {
    text-align: center;
    font-size: 28px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 28px;
  }

  .field {
    width: 100%;
    height: 48px;
    padding: 0 16px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
    font-size: 15px;
    outline: none;
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .field::placeholder {
    color: rgba(255, 255, 255, 0.35);
  }
  .field:focus {
    border-color: rgba(255, 255, 255, 0.5);
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.06);
  }

  .field + .field {
    margin-top: 20px;
  }

  .btn {
    display: block;
    width: 100%;
    height: 48px;
    margin-top: 24px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(102, 126, 234, 0.45);
  }
  .btn:active {
    transform: translateY(0);
    box-shadow: 0 4px 14px rgba(102, 126, 234, 0.35);
  }

  .footer-hint {
    text-align: center;
    font-size: 14px;
    color: rgba(255, 255, 255, 0.4);
    margin-top: 24px;
  }
  .footer-hint a {
    color: #a78bfa;
    text-decoration: none;
    cursor: pointer;
    transition: text-decoration 0.2s ease;
  }
  .footer-hint a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>

<canvas id="meteorCanvas"></canvas>

<div class="card-wrapper">
  <div class="card">
    <div class="card-title">欢迎回来</div>

    <input class="field" type="text" placeholder="用户名" />
    <input class="field" type="password" placeholder="密码" />

    <button class="btn">登 录</button>

    <p class="footer-hint">还没有账号？<a>立即注册</a></p>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('meteorCanvas');
  const ctx = canvas.getContext('2d');

  /* ========== 自适应尺寸 ========== */
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);
  }
  window.addEventListener('resize', resize);
  resize();

  const W = () => window.innerWidth;
  const H = () => window.innerHeight;

  /* ========== 星空背景层 ========== */
  const stars = [];
  const STAR_COUNT = 260;

  for (let i = 0; i < STAR_COUNT; i++) {
    stars.push({
      x: Math.random() * W(),
      y: Math.random() * H(),
      r: 0.5 + Math.random() * 1.5,
      alpha: 0.2 + Math.random() * 0.6,
      twinkleSpeed: 0.5 + Math.random() * 2.5,
      twinkleOffset: Math.random() * Math.PI * 2,
    });
  }

  /* ========== 流星类 ========== */
  class Meteor {
    constructor() {
      this.reset(true);
    }

    reset(initial) {
      /* 起始位置：左上区域 x:0~80%宽度, y:-50%高度以内 */
      this.x = Math.random() * W() * 0.8;
      this.y = -(Math.random() * H() * 0.5);

      /* 角度：π/4 (45°) ± 0.5 rad */
      const baseAngle = Math.PI / 4;
      this.angle = baseAngle + (Math.random() - 0.5) * 1.0;

      /* 速度：8-22 像素/帧 */
      this.speed = 8 + Math.random() * 14;

      /* 拖尾长度：60-160 像素 */
      this.tailLen = 60 + Math.random() * 100;

      /* 透明度：0.4-1.0 */
      this.alpha = 0.4 + Math.random() * 0.6;

      /* 暖色偏移 */
      this.warmShift = Math.random() * 0.15;

      if (initial) {
        /* 初次生成时让流星散布在不同阶段，避免全部同时出现 */
        this.y = Math.random() * H() * 1.5 - H() * 0.5;
        this.x = this.x - Math.random() * 300;
      }
    }

    update() {
      const vx = Math.cos(this.angle) * this.speed;
      const vy = Math.sin(this.angle) * this.speed;
      this.x += vx;
      this.y += vy;

      /* 飞出屏幕后重置 */
      if (this.y > H() + 200 || this.x > W() + 200 || this.x < -200) {
        this.reset(false);
      }
    }

    draw(ctx) {
      const w = W();
      const h = H();

      /* 拖尾起止点 */
      const tailStartX = this.x;
      const tailStartY = this.y;
      const tailEndX = this.x - Math.cos(this.angle) * this.tailLen;
      const tailEndY = this.y - Math.sin(this.angle) * this.tailLen;

      /* 线性渐变：头部不透明 → 尾部透明 */
      const grad = ctx.createLinearGradient(tailStartX, tailStartY, tailEndX, tailEndY);
      const headColor = `rgba(${255 - this.warmShift * 80}, ${255 - this.warmShift * 40}, ${255}, ${this.alpha})`;
      const tailColor = 'rgba(255, 255, 255, 0)';
      grad.addColorStop(0, headColor);
      grad.addColorStop(1, tailColor);

      /* 绘制拖尾 */
      ctx.save();
      ctx.globalAlpha = this.alpha;
      ctx.beginPath();
      ctx.moveTo(tailStartX, tailStartY);
      ctx.lineTo(tailEndX, tailEndY);
      ctx.strokeStyle = grad;
      ctx.lineWidth = 1.8;
      ctx.lineCap = 'round';
      ctx.stroke();
      ctx.restore();

      /* 头部发光光点 */
      ctx.save();
      ctx.beginPath();
      ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.shadowColor = '#fff';
      ctx.shadowBlur = 6 + Math.random() * 4;
      ctx.fill();
      ctx.restore();
    }
  }

  /* 创建流星 */
  const METEOR_COUNT = 50;
  const meteors = [];
  for (let i = 0; i < METEOR_COUNT; i++) {
    meteors.push(new Meteor());
  }

  /* ========== 可见性检测 ========== */
  let pageVisible = true;
  document.addEventListener('visibilitychange', () => {
    pageVisible = !document.hidden;
  });

  /* ========== 动画循环 ========== */
  let time = 0;
  function animate(ts) {
    if (!pageVisible) {
      requestAnimationFrame(animate);
      return;
    }

    time = ts * 0.001;
    const w = W();
    const h = H();

    ctx.clearRect(0, 0, w, h);

    /* 1. 绘制星空 */
    for (const star of stars) {
      const twinkle = Math.sin(time * star.twinkleSpeed + star.twinkleOffset) * 0.3 + 0.7;
      const alpha = star.alpha * twinkle;
      ctx.beginPath();
      ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
      ctx.fill();
    }

    /* 2. 绘制流星 */
    for (const meteor of meteors) {
      meteor.update();
      meteor.draw(ctx);
    }

    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);

  /* ========== resize 时重算星星位置 ========== */
  window.addEventListener('resize', () => {
    stars.forEach(s => {
      s.x = Math.random() * W();
      s.y = Math.random() * H();
    });
  });
})();
</script>
</body>
</html>
